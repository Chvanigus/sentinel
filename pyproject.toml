[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-processing"
version = "0.1.0"
description = "Pipeline for downloading, processing, and publishing Sentinel-2 imagery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geojson>=3.0,<4",
    "geoserver-restconfig>=2.0.9,<3",
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.12,<5",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "requests[socks]>=2.32,<3",
    "tqdm>=4.64,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["cdse*", "cli*", "core*", "db*", "domain*", "processing*", "satgeo*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cdse", "cli", "core", "db", "domain", "processing", "satgeo"]

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
